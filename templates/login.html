{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4 shadow">
            <h3 class="fw-bold text-center mb-4"><i class="bi bi-box-arrow-in-right text-success"></i> Acesso Restrito</h3>
            
            {% if erro %}
            <div class="alert alert-danger py-2 small text-center">{{ erro }}</div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="mb-3">
                    <label class="form-label text-muted">Usuário</label>
                    <input type="text" name="usuario" class="form-control bg-dark text-white border-secondary" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted">Senha</label>
                    <input type="password" name="senha" class="form-control bg-dark text-white border-secondary" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold">Entrar <i class="bi bi-arrow-right"></i></button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
